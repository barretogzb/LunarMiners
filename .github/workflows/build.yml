name: Compilar LunarMiners

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Compilar o mod
        run: gradle build --no-daemon --stacktrace

      - name: Testar o mundo lunar num servidor
        run: |
          mkdir -p run
          echo "eula=true" > run/eula.txt
          printf "online-mode=false\nlevel-seed=lunarminers\n" > run/server.properties
          gradle runServer --no-daemon < /dev/null > server.log 2>&1 &
          PID=$!
          OK=0
          for i in $(seq 1 200); do
            if grep -q 'Done (' server.log; then OK=1; break; fi
            if ! kill -0 $PID 2>/dev/null; then break; fi
            sleep 5
          done
          sleep 10
          kill $PID 2>/dev/null || true
          pkill -f runServer 2>/dev/null || true
          pkill -f 'net.minecraftforge' 2>/dev/null || true
          echo "===== Linhas importantes do servidor ====="
          grep -nE 'LunarMiners|lunarminers|ERROR|Exception|Caused by|Failed|Done \(' server.log | grep -v 'Mixin' | head -150 || true
          if [ "$OK" != "1" ]; then
            echo "===== Final do log ====="
            tail -150 server.log
            exit 1
          fi

      - name: Montar o modpack do Technic
        run: |
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          FORGE=$(grep '^forge_version=' gradle.properties | cut -d= -f2)
          VER=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          mkdir -p pack/bin pack/mods
          curl -fsSL -o pack/bin/modpack.jar \
            "https://maven.minecraftforge.net/net/minecraftforge/forge/$MC-$FORGE/forge-$MC-$FORGE-installer.jar"
          cp "build/libs/lunarminers-$VER.jar" pack/mods/
          (cd pack && zip -qr ../LunarMiners-modpack.zip .)
          cp "build/libs/lunarminers-$VER.jar" .
          echo "VER=$VER" >> "$GITHUB_ENV"
          unzip -l LunarMiners-modpack.zip

      - name: Publicar link direto para o Technic (branch modpack)
        run: |
          mkdir -p /tmp/direto && cp LunarMiners-modpack.zip /tmp/direto/
          cd /tmp/direto
          git init -q -b modpack
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LunarMiners-modpack.zip
          git commit -qm "Modpack ${{ env.VER }} build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" modpack

      - name: Publicar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}-build${{ github.run_number }}
          name: LunarMiners ${{ env.VER }} (build ${{ github.run_number }})
          body: |
            Versão para colocar no Technic: **${{ env.VER }}.${{ github.run_number }}**
            Link fixo do modpack: https://raw.githubusercontent.com/${{ github.repository }}/modpack/LunarMiners-modpack.zip
          make_latest: true
          files: |
            LunarMiners-modpack.zip
            lunarminers-${{ env.VER }}.jar
